# ================================================================
# config.properties — Cấu hình ứng dụng ApartmentRental
# ================================================================
# SAO CHÉP file này vào: src/main/resources/config.properties
# KHÔNG commit file này lên git (chứa thông tin nhạy cảm)
# ================================================================

# ── Thông tin ngân hàng nhận tiền (VietQR) ──────────────────────
# BIN ngân hàng: tra tại https://api.vietqr.io/v2/banks
# Ví dụ: MB = 970422 | Vietcombank = 970436 | Techcombank = 970407
bank.bin=970422
bank.account_no=YOUR_ACCOUNT_NUMBER
bank.account_name=NGUYEN VAN A
bank.name=MB Bank

# ── SePay Webhook (dùng khi test thanh toán thật) ───────────────
# Đăng ký miễn phí tại https://sepay.vn
# Sau khi có account → vào Settings → lấy API Key và Webhook Secret
sepay.api_key=YOUR_SEPAY_API_KEY
sepay.webhook_secret=YOUR_SEPAY_WEBHOOK_SECRET

# ── Thời gian hết hạn QR (phút) ─────────────────────────────────
qr.expire_minutes=15
